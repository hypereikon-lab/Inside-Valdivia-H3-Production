name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python tools/validate.py
      - run: python tools/readiness.py
      - run: python -m unittest discover -s tests -v

  source-locks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read locked component revisions
        id: locks
        run: |
          python - <<'PY'
          import json
          import os

          with open("runtime/compatibility-lock.json", encoding="utf-8") as handle:
              components = json.load(handle)["components"]

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              for name in (
                  "cauce",
                  "runtime_control",
                  "workspace_control",
                  "repository_control",
              ):
                  output.write(f"{name}={components[name]['commit']}\n")
          PY
      - run: git clone https://github.com/hypereikon-lab/ComfyUI-Cauce "$RUNNER_TEMP/cauce"
      - run: git -C "$RUNNER_TEMP/cauce" checkout "${{ steps.locks.outputs.cauce }}"
      - run: git clone https://github.com/hypereikon-lab/ComfyUI-Runtime-Control "$RUNNER_TEMP/runtime-control"
      - run: git -C "$RUNNER_TEMP/runtime-control" checkout "${{ steps.locks.outputs.runtime_control }}"
      - run: git clone https://github.com/hypereikon-lab/ComfyUI-Workspace-Control "$RUNNER_TEMP/workspace-control"
      - run: git -C "$RUNNER_TEMP/workspace-control" checkout "${{ steps.locks.outputs.workspace_control }}"
      - run: git clone https://github.com/hypereikon-lab/ComfyUI-Repository-Control "$RUNNER_TEMP/repository-control"
      - run: git -C "$RUNNER_TEMP/repository-control" checkout "${{ steps.locks.outputs.repository_control }}"
      - run: python tools/verify_cauce_lock.py "$RUNNER_TEMP/cauce"
      - run: python tools/sync_cauce_contracts.py "$RUNNER_TEMP/cauce" --check
      - run: python tools/verify_component_locks.py "$RUNNER_TEMP/cauce" "$RUNNER_TEMP/runtime-control" "$RUNNER_TEMP/workspace-control" "$RUNNER_TEMP/repository-control"
